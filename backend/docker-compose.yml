version: '3.8'

# ── Backend-only Docker Compose ──────────────────────────────────────────────
# The frontend is deployed separately (Vercel / Netlify / Render Static Site).
# This compose file runs only the Node.js/Express backend service.
#
# Usage:
#   cp backend/.env.example .env          # then fill in DATABASE_URL, JWT_SECRET
#   docker-compose up --build             # starts backend on port 5000
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s